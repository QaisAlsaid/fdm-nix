name: update fdm version and hash

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-fdm

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: fetch .deb, extract version and hash
        env:
          ASSET: freedownloadmanager.deb
        run: |
          wget -O "$ASSET" https://files2.freedownloadmanager.org/6/latest/freedownloadmanager.deb
          echo "asset=$ASSET" >> "$GITHUB_ENV"
          echo "version=$(dpkg-deb -f "$ASSET" Version)" >> "$GITHUB_ENV"
          echo "hash=$(nix hash file --algorithm sha256 "$ASSET")" >> "$GITHUB_ENV"

      - name: mirror .deb to release (immutable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ env.version }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "${{ env.asset }}"; then
              echo "release and asset already present"
            else
              echo "::error::release $TAG exists but is missing ${{ env.asset }} (wrong asset name?)"
              exit 1
            fi
          else
            gh release create "$TAG" "${{ env.asset }}" \
              --title "Free Download Manager $TAG" \
              --notes "Automated mirror of freedownloadmanager.org latest .deb"
          fi

      - name: write version.nix and verify build
        run: |
          cat << EOF > version.nix
          {
            version = "${{ env.version }}";
            url = "https://github.com/${{ github.repository }}/releases/download/v${{ env.version }}/${{ env.asset }}";
            hash = "${{ env.hash }}";
          }
          EOF
          nix build .#default
      - name: commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.nix
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update FDM to v${{ env.version }}"
            git push
          fi
