name: update fdm hash

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: fetch .deb and calculate sri hash
        run: |
          wget -O fdm.deb https://files2.freedownloadmanager.org/6/latest/freedownloadmanager.deb
          # calculate sha256 and convert hex to sri base64 format
          HEX=$(sha256sum fdm.deb | awk '{print $1}')
          SRI="sha256-$(echo $HEX | xxd -r -p | base64)"
          echo "$HEX" > sha256
          echo "$SRI" > sri
          rm fdm.deb

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sha256 sri
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update FDM hash" && git push)
