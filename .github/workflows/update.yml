name: update fdm version and hash

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: fetch .deb, extract version, and calculate hash
        run: |
          sudo apt-get update && sudo apt-get install -y dpkg-dev xxd
          
          wget -O fdm.deb https://files2.freedownloadmanager.org/6/latest/freedownloadmanager.deb
          
          VERSION=$(dpkg-deb -f fdm.deb Version)
          
          HEX=$(sha256sum fdm.deb | awk '{print $1}')
          B64=$(echo "$HEX" | xxd -r -p | base64 -w 0)
          HASH="sha256-$B64"
          
          cat << EOF > version.nix
          {
            version = "$VERSION";
            hash = "$HASH";
          }
          EOF
          
          rm fdm.deb

      - name: commit and push changes if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add version.nix
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update FDM to version v$VERSION" && git push)
